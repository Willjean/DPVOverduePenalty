<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发起豁免申请</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./theme.css">
</head>
<body class="body-bg">
    <!-- 导航栏 -->
    <nav class="header-bg header-shadow">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="header-title">TCL光伏开放平台</h1>
            <div class="flex space-x-4">
                <a href="order_overdue_agent.html" class="nav-link nav-link-active">自动超期记录</a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8">
        <section class="mb-12">
            <div class="card">
                <h2 class="section-title">发起豁免申请</h2>
                
                <!-- 订单信息 -->
                <div class="mb-8">
                    <h3 class="text-lg font-medium mb-4 text-gray-800">订单信息</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="form-label">平台编号</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">GF25112009240017317</div>
                        </div>
                        <div>
                            <label class="form-label">代理商</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">高州新易新能源科技有限公司</div>
                        </div>
                        <div>
                            <label class="form-label">安装地区</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">广东省湛江市廉江市</div>
                        </div>
                        <div>
                            <label class="form-label">产品</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">光耀宝</div>
                        </div>
                        <div>
                            <label class="form-label">客户姓名</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">黄华振</div>
                        </div>
                        <div>
                            <label class="form-label">订单状态</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">待放款</div>
                        </div>
                        <div>
                            <label class="form-label">当前梯度</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">梯度2</div>
                        </div>
                        <div>
                            <label class="form-label">实际安装量/K</label>
                            <div class="px-3 py-2 bg-gray-100 rounded-md">30.660</div>
                        </div>
                    </div>
                </div>
                
                <!-- 豁免申请 -->
                <div class="mb-8">
                    <h3 class="text-lg font-medium mb-4 text-gray-800">豁免申请信息</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="form-label">选择豁免梯度<span class="text-red-500">*</span></label>
                            <select class="form-input w-full">
                                <option value="">请选择豁免梯度</option>
                                <option value="1">梯度1</option>
                                <option value="2">梯度2</option>
                                <option value="3">梯度3</option>
                                <option value="4">梯度4</option>
                                <option value="5">梯度5</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="form-label">豁免原因<span class="text-red-500">*</span></label>
                        <textarea class="form-input w-full" rows="4" placeholder="请输入豁免原因"></textarea>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex justify-end space-x-4">
                    <button class="btn btn-outline" onclick="window.close()">取消</button>
                    <button class="btn btn-primary">提交申请</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer bg-gray-800 text-white">
        <div class="container mx-auto px-4 text-center">
            <p>© 2026 TCL光伏开放平台</p>
        </div>
    </footer>
</body>
</html>

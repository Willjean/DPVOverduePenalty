<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
        }
        
        .header {
            background-color: #e63a3a;
            color: white;
            padding: 20px 15px;
            position: relative;
        }
        
        .header-left {
            position: absolute;
            left: 15px;
            top: 20px;
        }
        
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .header-right {
            position: absolute;
            right: 15px;
            top: 20px;
        }
        
        .status-bar {
            background-color: #e63a3a;
            padding: 15px;
            color: white;
        }
        
        .status-title {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .status-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .badge.active {
            background-color: white;
            color: #e63a3a;
        }
        
        .info-section {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .warning-section {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-left: 4px solid #ff9800;
            padding: 12px;
            margin: 10px 15px;
            border-radius: 4px;
        }
        
        .warning-text {
            color: #e67e22;
            font-size: 14px;
        }
        
        .process-steps {
            background-color: white;
            padding: 20px 15px;
            margin-bottom: 10px;
        }
        
        .step-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .step-icon.active {
            background-color: #e63a3a;
            color: white;
        }
        
        .step-icon.completed {
            background-color: #e63a3a;
            color: white;
        }
        
        .step-icon.pending {
            background-color: #e0e0e0;
            color: #9e9e9e;
        }
        
        .step-label {
            font-size: 12px;
            text-align: center;
        }
        
        .step-line {
            flex: 1;
            height: 1px;
            background-color: #e0e0e0;
            margin: 0 5px;
        }
        
        .step-line.active {
            background-color: #e63a3a;
        }
        
        .section {
            background-color: white;
            margin-bottom: 10px;
            overflow: hidden;
        }
        
        .section-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .section-status {
            font-size: 14px;
            color: #9e9e9e;
        }
        
        .section-status.pending {
            color: #ff9800;
        }
        
        .section-status.completed {
            color: #4caf50;
        }
        
        .location-section {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .location-title {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .location-address {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .recommend-btn {
            background-color: white;
            border: 1px solid #e63a3a;
            color: #e63a3a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .footer {
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span>←</span>
        </div>
        <div class="header-title">陈新桥</div>
        <div class="header-right">
            <span>☎</span>
            <span style="margin-left: 10px;">!</span>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="status-title">施工验收退回 ></div>
        <div class="status-badges">
            <div class="badge active">光瑞宝</div>
            <div class="badge">+ 长期</div>
            <div class="badge">润隆铸鑫-印娟正在处理</div>
        </div>
    </div>
    
    <div class="info-section">
        <div class="info-item">
            <span>平台编号</span>
            <span>GF250808102437053338</span>
        </div>
        <div class="info-item">
            <span>创建</span>
            <span>2025/08/08 10:24</span>
        </div>
    </div>
    
    <div class="warning-section">
        <div class="warning-text">当前梯度并网截止时间：2026/05/24 08:50:51,若未完成将进入下一梯度！</div>
    </div>
    
    <div class="process-steps">
        <div class="step-container">
            <div class="step">
                <div class="step-icon completed">👤</div>
                <div class="step-label">预审</div>
            </div>
            <div class="step-line active"></div>
            <div class="step">
                <div class="step-icon completed">📋</div>
                <div class="step-label">踏勘</div>
            </div>
            <div class="step-line active"></div>
            <div class="step">
                <div class="step-icon completed">🚚</div>
                <div class="step-label">物流</div>
            </div>
            <div class="step-line active"></div>
            <div class="step">
                <div class="step-icon active">👷</div>
                <div class="step-label">施工</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-icon pending">⚡</div>
                <div class="step-label">并网</div>
            </div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <div class="section-title">合同签约</div>
            <div class="section-status completed">2份合同签约成功 ></div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <div class="section-title">施工信息</div>
            <div class="section-status pending">待完成 ></div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <div class="section-title">设备信息</div>
            <div class="section-status completed">已完成 ></div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <div class="section-title">备案信息</div>
            <div class="section-status completed">已完成 ></div>
        </div>
    </div>
    
    <div class="section">
        <div class="section-header">
            <div class="section-title">影像件信息</div>
            <div class="section-status completed">已完成 ></div>
        </div>
    </div>
    
    <div class="location-section">
        <div class="location-title">祝庭百货商店附近29米</div>
        <div class="location-address">江苏省泰州市泰兴市河失镇</div>
        <button class="recommend-btn">
            <span>👷</span>
            <span>一键施工队推荐</span>
        </button>
    </div>
    
    <div class="footer"></div>
</body>
</html>
